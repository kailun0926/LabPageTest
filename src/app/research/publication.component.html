<div [class]="'container-fluid'" [style]="'border: 20px solid #f8f9fa; padding: 0; min-height: 100vh;'">
<div [class]="'project-header-block text-center py-5'">
  <div [class]="'container'">
    <h2>Publication</h2>    
    <hr [class]="'title-accent-line'">
  </div>
</div>

<div [class]="'row w-100 m-0 g-0'">
<div [class]="'col-md-12 publications-column'">
@for (paper of publications(); track paper.link) {
    <a [href]="paper.link" target="_blank" [class]="'paper-card-link'">
      <div [class]="'card paper-card h-100'">
        
        <div [class]="'card-body d-flex flex-column'">
          
          <div [class]="'flex-grow-1'">
            <h5 [class]="'card-title mb-2'">{{ paper.title }}</h5>
            <p [class]="'card-subtitle mb-2 text-muted'">
              {{ paper.publisher }}
            </p>
          </div>
          
          <div [class]="'mt-auto d-flex justify-content-between align-items-center'">
            <p [class]="'card-text text-muted mb-0'" [style.font-size.rem]="0.85">
              {{ paper.publishDate }}
            </p>
            
            <span [class]="'text-primary fw-bold'" [style.font-size.rem]="0.9">
              Read Paper <i class="bi bi-arrow-right-short"></i>
            </span>
          </div>

        </div>
      </div>
    </a>
  } @empty {
    <p>No publications available at this time.</p>
  }
  </div>
</div>
</div>
